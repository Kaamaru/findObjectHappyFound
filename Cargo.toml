[package]
name = "send_img_axum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["macros", "multipart"] }
axum-valid = { version = "0.24.0", default-features = false, features = ["garde", "basic"] }
dotenv = "0.15.0"
garde = { version = "0.22.0", features = ["derive", "full"] }
once_cell = "1.21.3"
reqwest = { version = "0.12.24", features = ["multipart"] }
rust-s3 = "0.37.0"
serde = "1.0.228"
serde_json = "1.0.145"
sqlx-postgres = "0.8.6"
supabase_rs = { version = "0.5.0", features = ["rustls", "storage"] }
tokio = { version = "1.48.0", features = ["full"] }
ts-rs = "11.1.0"
validator = { version = "0.20.0", features = ["derive"] }
